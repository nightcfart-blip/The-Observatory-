
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#02040b">
  <meta name="color-scheme" content="dark">

  <meta
    name="description"
    content="A personal celestial archive of films, series, stories and memories."
  >

  <title>Watch Archive — Universe</title>

  <link rel="stylesheet" href="./style.css">

  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>

<body>

  <!-- =====================================
       COSMIC BACKGROUND
       Procedural nebula and distant stars
  ====================================== -->

  <div class="universe" aria-hidden="true">
    <div class="space-base"></div>

    <canvas id="nebulaCanvas"></canvas>
    <canvas id="backgroundStars"></canvas>

    <div class="space-vignette"></div>
  </div>


  <!-- =====================================
       EXPLORABLE WORLD

       Canvas draws star glows and lines.
       HTML overlay keeps text sharp.
  ====================================== -->

  <main
    id="viewport"
    class="viewport"
    tabindex="0"
    aria-label="Explore your celestial media archive"
  >

    <canvas
      id="constellationCanvas"
      class="constellation-canvas"
      aria-hidden="true"
    ></canvas>

    <div
      id="starLayer"
      class="star-layer"
      aria-label="Celestial navigation"
    ></div>

  </main>


  <!-- =====================================
       MINIMAL CONTROLS
  ====================================== -->

  <div class="universe-controls">

    <button
      type="button"
      id="homeButton"
      class="minimal-control"
      aria-label="Return to main constellation"
      title="Return to main constellation"
    >
      ✧
    </button>

    <button
      type="button"
      id="focusButton"
      class="minimal-control"
      aria-label="Focus on nearest constellation"
      title="Focus on nearest constellation"
    >
      ⌾
    </button>

    <button
      type="button"
      id="searchButton"
      class="minimal-control search-control"
      aria-label="Search the archive"
      title="Search archive"
    >
      <svg
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.35"
        stroke-linecap="round"
      >
        <circle cx="10.6" cy="10.6" r="6.4"></circle>
        <path d="M15.5 15.5L21 21"></path>
      </svg>
    </button>

  </div>


  <!-- =====================================
       SEARCH INTERFACE
  ====================================== -->

  <div
    id="searchOverlay"
    class="search-overlay"
    aria-hidden="true"
  >
    <div id="searchBackdrop" class="search-backdrop"></div>

    <section
      class="search-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="searchHeading"
    >

      <div class="search-heading-row">
        <h2 id="searchHeading">Find a story</h2>

        <button
          type="button"
          id="closeSearchButton"
          class="close-button"
          aria-label="Close search"
        >
          ×
        </button>
      </div>

      <label class="visually-hidden" for="globalSearch">
        Search titles
      </label>

      <input
        id="globalSearch"
        class="search-input"
        type="search"
        placeholder="Search your universe..."
        autocomplete="off"
        spellcheck="false"
      >

      <div
        id="searchResults"
        class="search-results"
        aria-live="polite"
      ></div>

    </section>
  </div>


  <!-- =====================================
       COLLECTION & DETAIL SHEET
  ====================================== -->

  <div
    id="detailOverlay"
    class="detail-overlay"
    aria-hidden="true"
  >

    <div
      id="detailBackdrop"
      class="detail-backdrop"
    ></div>

    <section
      id="detailSheet"
      class="detail-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
      tabindex="-1"
    >

      <button
        type="button"
        id="closeDetailButton"
        class="detail-close"
        aria-label="Close panel"
      >
        ×
      </button>

      <div id="detailContent" class="detail-content"></div>

    </section>
  </div>


  <!-- =====================================
       LOCAL BACKUP IMPORT
  ====================================== -->

  <input
    type="file"
    id="importFile"
    accept=".json,application/json"
    hidden
  >


  <!-- =====================================
       SMALL NOTIFICATIONS
  ====================================== -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

</body>
</html>
