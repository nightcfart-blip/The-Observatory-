
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
  >
  <meta name="theme-color" content="#030409">
  <meta name="color-scheme" content="dark">
  <meta
    name="description"
    content="A private universe of stories, films, and series."
  >

  <title>Watch Archive — Universe</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>

<body>

  <!-- SPACE BACKGROUND -->
  <div class="universe" aria-hidden="true">
    <div class="space-base"></div>
    <div class="nebula nebula-one"></div>
    <div class="nebula nebula-two"></div>
    <canvas id="backgroundStars"></canvas>
    <div class="space-vignette"></div>
  </div>

  <!-- WORLD VIEWPORT -->
  <main
    id="viewport"
    class="viewport"
    aria-label="Interactive celestial archive"
    tabindex="0"
  >
    <div id="world" class="world">
      <svg
        id="connectionLayer"
        class="connection-layer"
        aria-hidden="true"
      ></svg>

      <div id="starLayer" class="star-layer"></div>
    </div>
  </main>

  <!-- MINIMAL FIXED INTERFACE -->
  <header class="hud-header">

    <button
      id="brandButton"
      class="brand-button"
      type="button"
      aria-label="Return to the main universe"
    >
      <span class="brand-sigil">✧</span>

      <span class="brand-copy">
        <strong>WATCH ARCHIVE</strong>
        <small>A UNIVERSE OF YOUR OWN</small>
      </span>
    </button>

    <div class="save-status" id="saveStatus">
      <span class="save-light"></span>
      <span id="saveText">Local archive</span>
    </div>
  </header>

  <!-- LOCATION / BREADCRUMBS -->
  <nav
    class="breadcrumbs"
    id="breadcrumbs"
    aria-label="Constellation location"
  ></nav>

  <!-- SCENE HEADING -->
  <div class="scene-intro" id="sceneIntro">
    <span id="sceneEyebrow" class="scene-eyebrow">
      THE OBSERVATORY
    </span>
    <h1 id="sceneTitle">Your Universe</h1>
    <p id="sceneSubtitle">
      Every story leaves a star behind.
    </p>
  </div>

  <!-- CAMERA CONTROLS -->
  <div class="camera-controls">
    <button
      id="zoomInButton"
      class="camera-button"
      type="button"
      aria-label="Zoom in"
      title="Zoom in"
    >+</button>

    <button
      id="zoomOutButton"
      class="camera-button"
      type="button"
      aria-label="Zoom out"
      title="Zoom out"
    >−</button>

    <button
      id="focusButton"
      class="camera-button focus-button"
      type="button"
      aria-label="Center the constellation"
      title="Center constellation"
    >⌾</button>
  </div>

  <!-- NAVIGATION -->
  <div class="travel-controls">

    <button
      id="backButton"
      class="travel-button"
      type="button"
      aria-label="Go back"
      disabled
    >
      <span>←</span>
      <span>BACK</span>
    </button>

    <button
      id="homeButton"
      class="travel-button"
      type="button"
    >
      <span>✧</span>
      <span>UNIVERSE</span>
    </button>

  </div>

  <!-- DISCOVERY HINT -->
  <div class="interaction-hint" id="interactionHint">
    <span>DRAG TO EXPLORE</span>
    <span class="hint-divider">·</span>
    <span>PINCH TO ZOOM</span>
    <span class="hint-divider">·</span>
    <span>TAP A STAR</span>
  </div>

  <!-- INFORMATION LAYER -->
  <div
    id="detailOverlay"
    class="detail-overlay"
    aria-hidden="true"
  >
    <div
      class="detail-backdrop"
      id="detailBackdrop"
    ></div>

    <section
      class="detail-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
    >
      <button
        id="closeDetailButton"
        class="detail-close"
        type="button"
        aria-label="Close details"
      >×</button>

      <div class="detail-content" id="detailContent"></div>
    </section>
  </div>

  <!-- BACKUP IMPORT -->
  <input
    type="file"
    id="importFile"
    accept=".json,application/json"
    hidden
  >

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

</body>
</html>
