
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#020308">
  <meta name="color-scheme" content="dark">

  <meta
    name="description"
    content="A private universe of films, series, stories and memories."
  >

  <title>Watch Archive — Universe</title>

  <link rel="stylesheet" href="./style.css">

  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>

<body>

  <!-- ===================================
       THE COSMIC BACKGROUND
  ==================================== -->

  <div class="universe" aria-hidden="true">

    <div class="space-base"></div>

    <div class="cosmic-haze haze-one"></div>
    <div class="cosmic-haze haze-two"></div>

    <canvas id="backgroundStars"></canvas>

    <div class="space-vignette"></div>

  </div>


  <!-- ===================================
       THE EXPLORABLE UNIVERSE
  ==================================== -->

  <main
    id="viewport"
    class="viewport"
    tabindex="0"
    aria-label="Explore your personal universe"
  >

    <div id="world" class="world">

      <!-- Constellation connections -->
      <svg
        id="connectionLayer"
        class="connection-layer"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      ></svg>

      <!-- Stars, groups, productions and
           constellations generated by app.js -->
      <div
        id="starLayer"
        class="star-layer"
      ></div>

    </div>

  </main>


  <!-- ===================================
       MINIMAL FLOATING CONTROLS
  ==================================== -->

  <div class="universe-controls">

    <button
      id="homeButton"
      class="minimal-control home-control"
      type="button"
      aria-label="Focus on the main constellation"
      title="Return to main constellation"
    >
      ✧
    </button>

    <button
      id="focusButton"
      class="minimal-control"
      type="button"
      aria-label="Center current constellation"
      title="Center constellation"
    >
      ⌾
    </button>

  </div>


  <!-- ===================================
       CAMERA ZOOM INDICATOR
  ==================================== -->

  <div
    id="zoomIndicator"
    class="zoom-indicator"
    aria-hidden="true"
  >
    <span class="zoom-track">
      <span id="zoomMarker" class="zoom-marker"></span>
    </span>
  </div>


  <!-- ===================================
       INFORMATION / DETAIL OVERLAY
  ==================================== -->

  <div
    id="detailOverlay"
    class="detail-overlay"
    aria-hidden="true"
  >

    <div
      id="detailBackdrop"
      class="detail-backdrop"
    ></div>

    <section
      id="detailSheet"
      class="detail-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
      tabindex="-1"
    >

      <button
        id="closeDetailButton"
        class="detail-close"
        type="button"
        aria-label="Close details"
      >
        ×
      </button>

      <div
        id="detailContent"
        class="detail-content"
      ></div>

    </section>

  </div>


  <!-- ===================================
       IMPORT / EXPORT SUPPORT
  ==================================== -->

  <input
    id="importFile"
    type="file"
    accept=".json,application/json"
    hidden
  >


  <!-- ===================================
       SUBTLE NOTIFICATIONS
  ==================================== -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

</body>
</html>
