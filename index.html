
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#02040b">
  <meta name="color-scheme" content="dark">

  <meta
    name="description"
    content="A private celestial archive of films, series, seasons and episodes."
  >

  <title>Watch Archive — Universe</title>

  <link rel="stylesheet" href="./style.css">

  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>

<body>

  <!-- COSMIC BACKGROUND -->

  <div class="universe" aria-hidden="true">
    <div class="space-base"></div>

    <canvas id="nebulaCanvas"></canvas>
    <canvas id="backgroundStars"></canvas>

    <div class="space-vignette"></div>
  </div>


  <!-- CONTINUOUS CELESTIAL WORLD -->

  <main
    id="viewport"
    class="viewport"
    tabindex="0"
    aria-label="Explore your celestial archive"
  >

    <canvas
      id="constellationCanvas"
      class="constellation-canvas"
      aria-hidden="true"
    ></canvas>

    <div
      id="starLayer"
      class="star-layer"
      aria-label="Interactive constellation stars"
    ></div>

  </main>


  <!-- MINIMAL CONTROLS -->

  <nav class="universe-controls" aria-label="Universe tools">

    <button
      id="homeButton"
      class="minimal-control"
      type="button"
      aria-label="Focus on main constellation"
      title="Main constellation"
    >✧</button>

    <button
      id="focusButton"
      class="minimal-control"
      type="button"
      aria-label="Focus on nearest star"
      title="Focus on nearest star"
    >⌾</button>

    <button
      id="searchButton"
      class="minimal-control"
      type="button"
      aria-label="Search archive"
      title="Search archive"
    >
      <svg viewBox="0 0 24 24" width="20" height="20"
        fill="none" stroke="currentColor"
        stroke-width="1.4" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="6.5"></circle>
        <path d="M15.5 15.5L21 21"></path>
      </svg>
    </button>

  </nav>


  <!-- SEARCH -->

  <div
    id="searchOverlay"
    class="overlay search-overlay"
    aria-hidden="true"
  >
    <div id="searchBackdrop" class="overlay-backdrop"></div>

    <section
      class="search-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="searchHeading"
      tabindex="-1"
    >
      <div class="panel-topline">
        <h2 id="searchHeading">Find a story</h2>
        <button
          id="closeSearchButton"
          class="close-button"
          type="button"
          aria-label="Close search"
        >×</button>
      </div>

      <label class="visually-hidden" for="globalSearch">
        Search titles
      </label>

      <input
        id="globalSearch"
        class="search-input"
        type="search"
        placeholder="Search your universe..."
        autocomplete="off"
        spellcheck="false"
      >

      <div
        id="searchResults"
        class="search-results"
        aria-live="polite"
      ></div>
    </section>
  </div>


  <!-- LIBRARY, DETAILS, GENRES & SETTINGS -->

  <div
    id="detailOverlay"
    class="overlay detail-overlay"
    aria-hidden="true"
  >
    <div id="detailBackdrop" class="overlay-backdrop"></div>

    <section
      id="detailSheet"
      class="detail-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
      tabindex="-1"
    >
      <button
        id="closeDetailButton"
        class="close-button detail-close"
        type="button"
        aria-label="Close details"
      >×</button>

      <div id="detailContent" class="detail-content"></div>
    </section>
  </div>


  <!-- CREATE & EDIT PANEL -->

  <div
    id="editorOverlay"
    class="overlay editor-overlay"
    aria-hidden="true"
  >
    <div id="editorBackdrop" class="overlay-backdrop"></div>

    <section
      id="editorSheet"
      class="editor-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="editorTitle"
      tabindex="-1"
    >
      <div class="editor-header">
        <div>
          <span id="editorEyebrow" class="panel-eyebrow">
            YOUR ARCHIVE
          </span>
          <h2 id="editorTitle">Create & Edit</h2>
        </div>

        <button
          id="closeEditorButton"
          class="close-button"
          type="button"
          aria-label="Close editor"
        >×</button>
      </div>

      <div
        id="editorContent"
        class="editor-content"
      ></div>
    </section>
  </div>


  <!-- CONFIRMATION DIALOG -->

  <div
    id="confirmOverlay"
    class="overlay confirm-overlay"
    aria-hidden="true"
  >
    <div class="overlay-backdrop"></div>

    <section
      class="confirm-sheet"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirmTitle"
      aria-describedby="confirmMessage"
    >
      <h2 id="confirmTitle">Are you sure?</h2>

      <p id="confirmMessage"></p>

      <div class="confirm-actions">
        <button
          id="cancelConfirmButton"
          class="soft-button"
          type="button"
        >Cancel</button>

        <button
          id="acceptConfirmButton"
          class="soft-button danger-button"
          type="button"
        >Delete</button>
      </div>
    </section>
  </div>


  <!-- BACKUP IMPORT -->

  <input
    id="importFile"
    type="file"
    accept=".json,application/json"
    hidden
  >


  <!-- NOTIFICATIONS -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

</body>
</html>
